<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161616" />
  <link rel="icon" type="image/x-icon" href="./icons/icon.ico" />
  <link rel="apple-touch-icon" href="./icons/icon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Budburry's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img id="brand-logo" src="" alt="Budburry's" class="logo" />
      <div class="topbar-right">
        <button id="download-toggle" class="theme-toggle" type="button" aria-label="Download">
          <span id="download-toggle-icon" class="ui-icon icon-download"></span>
        </button>
        <button id="btn-sort-name-mob" class="view-btn topbar-sort-btn" title="Sort by name">
          <span class="view-icon icon-name"></span>
        </button>
        <button id="btn-sort-star-mob" class="view-btn topbar-sort-btn" title="Sort by rating">
          <span class="view-icon icon-star"></span>
        </button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span id="theme-toggle-icon" class="ui-icon icon-moon"></span>
        </button>
        <button id="settings-toggle" class="theme-toggle" type="button" aria-label="Settings">
          <span class="ui-icon icon-settings"></span>
        </button>
      </div>
      <div id="input-area">
        <div id="search-wrap" class="search-wrap">
          <input id="search-input" class="search-input" type="text" placeholder="Search name" autocomplete="off" />
          <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
        </div>
        <div id="download-wrap" class="download-wrap hidden">
          <div class="download-row">
            <input id="download-input" class="download-input" type="text" placeholder="Paste a link" autocomplete="off" />
            <button id="download-btn" class="download-btn" type="button">DOWNLOAD</button>
          </div>
          <div id="download-status" class="download-status hidden">DOWNLOAD SUCCESSFUL</div>
          <div id="download-progress-wrap" class="download-progress-wrap hidden">
            <div id="download-progress-bar" class="download-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-head">
          <h2>Category</h2>
          <button id="category-add-btn" class="add-btn" type="button">+ Add</button>
        </div>
        <div class="panel-body">
          <ul id="category-list"></ul>
          <input id="new-category-input" class="new-emote-input hidden" type="text" placeholder="Enter new category" />
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>Emote</h2>
          <button id="emote-add-btn" class="add-btn" type="button">+ Add</button>
        </div>
        <div class="panel-body">
          <ul id="emote-list"></ul>
          <input id="new-emote-input" class="new-emote-input hidden" type="text" placeholder="Enter new emote" />
        </div>
      </section>
    </aside>

    <main class="content">
      <div class="toolbar">
        <div id="selected-filters" class="selected-filters"></div>
        <div class="view-controls">
          <button id="btn-view-grid" class="view-btn active" title="Grid">
            <span class="view-icon icon-grid"></span>
          </button>
          <button id="btn-view-list" class="view-btn" title="List">
            <span class="view-icon icon-list"></span>
          </button>
          <button id="btn-sort-name" class="view-btn" style="margin-left:2.75rem" title="Sort by name">
            <span class="view-icon icon-name"></span>
          </button>
          <button id="btn-sort-star" class="view-btn" title="Sort by rating">
            <span class="view-icon icon-star"></span>
          </button>
        </div>
      </div>

      <div id="song-grid" class="song-grid"></div>
      <audio id="audio-player" preload="metadata"></audio>
    </main>
  </div>

  <div id="preloader" class="preloader">
    <div class="preloader-content">
      <img id="preloader-logo" src="" alt="Budburry's" class="preloader-logo" />
      <div class="preloader-progress-wrap">
        <div id="preloader-bar" class="preloader-progress-bar"></div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const saved = localStorage.getItem("theme-mode");
      const isDark = saved === "dark";
      const logoSrc = isDark ? "/logo_white.svg" : "/logo_black.svg";
      const preloaderLogo = document.getElementById("preloader-logo");
      if (preloaderLogo) preloaderLogo.src = logoSrc;
    })();
  </script>

  <div id="tag-menu" class="tag-menu hidden"></div>

  <!-- Folder browser modal -->
  <div id="folder-browser-overlay" class="custom-dialog-overlay hidden">
    <div class="folder-browser">
      <div class="folder-browser-header">
        <button id="folder-browser-back" class="folder-browser-back-btn">←</button>
        <span id="folder-browser-path" class="folder-browser-current-path"></span>
      </div>
      <button id="folder-browser-select" class="folder-browser-select-btn">Select this folder</button>
      <div id="folder-browser-list" class="folder-browser-list"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-overlay" class="custom-dialog-overlay hidden">
    <div class="custom-dialog" style="min-width:360px;max-width:520px">
      <p style="margin:0;font-size:15px;font-weight:600;color:var(--text)">Settings</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:12px;color:var(--muted)">MP3 folder path</label>
        <div style="display:flex;gap:8px">
          <input id="settings-mp3-path" class="custom-dialog-input" type="text" placeholder="/path/to/mp3" style="flex:1" />
          <button id="settings-browse" class="custom-dialog-btn custom-dialog-btn-cancel" type="button">Browse</button>
        </div>
      </div>
      <div class="custom-dialog-btns">
        <button id="settings-cancel" class="custom-dialog-btn custom-dialog-btn-cancel" type="button">Cancel</button>
        <button id="settings-save" class="custom-dialog-btn custom-dialog-btn-ok" type="button">Save</button>
      </div>
    </div>
  </div>

  <!-- Custom dialog (replaces window.prompt/confirm blocked by Electron) -->
  <div id="custom-dialog-overlay" class="custom-dialog-overlay hidden">
    <div class="custom-dialog">
      <p id="custom-dialog-message"></p>
      <input id="custom-dialog-input" class="custom-dialog-input" type="text" />
      <div class="custom-dialog-btns">
        <button id="custom-dialog-ok" class="custom-dialog-btn custom-dialog-btn-ok" type="button">OK</button>
        <button id="custom-dialog-cancel" class="custom-dialog-btn custom-dialog-btn-cancel" type="button">Zrušiť</button>
      </div>
    </div>
  </div>
  <section id="bottom-player" class="bottom-player hidden">
    <div class="player-song">
      <div id="player-cover" class="player-cover"></div>
      <div class="player-meta">
        <div id="player-title" class="player-title"></div>
        <div id="player-subtitle" class="player-subtitle"></div>
      </div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button id="player-prev" type="button" class="player-btn player-btn-rewind" aria-label="Previous"><span class="ui-icon icon-rewind-left"></span></button>
        <button id="player-toggle" type="button" class="player-btn player-btn-main" aria-label="Play/Pause"><span id="player-toggle-icon" class="ui-icon icon-play"></span></button>
        <button id="player-next" type="button" class="player-btn player-btn-rewind" aria-label="Next"><span class="ui-icon icon-rewind-right"></span></button>
      </div>
      <div class="player-timeline">
        <span id="player-current-time" class="time-text">0:00</span>
        <div id="player-seek" class="player-seek">
          <div id="player-seek-bar" class="player-seek-bar"></div>
        </div>
        <span id="player-total-time" class="time-text">0:00</span>
      </div>
    </div>
    <div class="player-volume-wrap">
      <canvas id="visualizer" class="visualizer"></canvas>
      <div class="player-volume-controls">
        <button id="player-volume-toggle" type="button" class="player-volume-icon" aria-label="Mute">
          <svg class="player-volume-svg" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
            <path d="m7.332 13.9-4.001-4H.808a.808.808 0 0 1-.804-.726L0 9.092V5.09c0-.447.362-.808.808-.808H3.33l4-4.001V13.9ZM8.998 0a7.276 7.276 0 0 1 5.658 7.092 7.275 7.275 0 0 1-5.658 7.092v-1.67a5.66 5.66 0 0 0 0-10.844V0Zm0 3.834a3.637 3.637 0 0 1 0 6.516V3.833Z"/>
          </svg>
        </button>
        <div id="player-volume" class="player-volume">
          <div id="player-volume-bar" class="player-volume-bar"></div>
        </div>
      </div>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
